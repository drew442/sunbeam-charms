type: charm
name: cinder-volume-lvm-san
summary: OpenStack volume service - LVM SAN backend

description: |
  Subordinate charm that wires cinder-volume to an HA LVM SAN backend
  managed by the lvm-san machine charm.

assumes:
  - juju >= 3.1

links:
  source:
    - https://opendev.org/openstack/sunbeam-charms
  issues:
    - https://bugs.launchpad.net/sunbeam-charms

base: ubuntu@24.04
platforms:
  amd64:

subordinate: true

config:
  options:
    backend-availability-zone:
      type: string
      default: null
      description: |
        Availability zone to associate with this backend.
    target-helper:
      type: string
      default: lioadm
      description: |
        Cinder target helper to use for iSCSI exports.
    backend-host:
      type: string
      default: lvm-san-cluster
      description: |
        Virtual backend host name shared by active/passive lvm-san nodes.

requires:
  cinder-volume:
    interface: cinder-volume
    scope: container
    limit: 1
  lvm-san-backend:
    interface: lvm-san-backend
    limit: 1
  tracing:
    interface: tracing
    optional: true
    limit: 1

parts:
  update-certificates:
    plugin: nil
    override-build: |
      apt update
      apt install -y ca-certificates
      update-ca-certificates
  charm:
    after:
      - update-certificates
    build-packages:
      - git
      - libffi-dev
      - libssl-dev
      - pkg-config
      - rustc-1.80
      - cargo-1.80
    charm-binary-python-packages:
      - cryptography
      - pydantic
      - jinja2
    build-snaps: [astral-uv]
    override-build: |
      uv export --frozen --no-hashes --format=requirements-txt -o requirements.txt
      craftctl default
    charm-requirements: [requirements.txt]
